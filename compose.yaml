services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - teamdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  cache:
    image: redis:8

volumes:
  teamdata:
